<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendy Premium</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Kustom Style Spendy Premium -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-900 font-sans text-slate-800 antialiased flex justify-center overflow-hidden md:py-8">

    <!-- MOBILE CONTAINER PREVIEW -->
    <!-- h-full and overflow-hidden ensures the container never scrolls as a whole -->
    <div
        class="w-full max-w-md bg-slate-50 h-full md:max-h-[85vh] md:rounded-[2rem] shadow-2xl flex flex-col relative overflow-hidden border border-slate-800/10">

        <!-- ==================== TAB 1: BUDGETING (iframe) ==================== -->
        <section id="tab-budgeting" class="hidden flex-1 flex flex-col overflow-hidden">
            <iframe
                src="budgeting_supabase.html?embed=1"
                id="budgetingIframe"
                class="w-full flex-1 border-none"
                style="border: none; width: 100%; height: 100%; display: block;"
                title="Rencana Budgeting">
            </iframe>
        </section>

        <!-- ==================== TAB 2: TRANSAKSI ==================== -->
        <section id="tab-transactions" class="flex-1 flex flex-col overflow-hidden">
            <div class="p-6 pb-4 bg-white border-b border-slate-100 shrink-0 z-10 shadow-sm">
                <h2 class="text-xl font-bold text-slate-800 tracking-tight mb-4">Riwayat Transaksi</h2>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <select id="filterCategory" onchange="filterAndRenderTransactions()"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-teal-600 text-slate-700 appearance-none">
                            <option value="ALL">Semua Kategori</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="relative flex-1">
                        <select id="filterSource" onchange="filterAndRenderTransactions()"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-teal-600 text-slate-700 appearance-none">
                            <option value="ALL">Semua Sumber</option>
                            <option value="Cash">Cash</option>
                            <option value="E-Wallet">E-Wallet</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- This area scrolls -->
            <div id="transactionFeed" class="flex-1 p-6 space-y-3 overflow-y-auto bg-slate-50 hide-scrollbar">
                <!-- Loaded dynamically -->
            </div>
        </section>

        <!-- ==================== TAB 3: LAPORAN ==================== -->
        <section id="tab-reports" class="hidden flex-1 flex flex-col overflow-y-auto hide-scrollbar p-6 space-y-6">
            <h2 class="text-xl font-bold text-slate-800 tracking-tight">Analisis Keuangan</h2>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="font-bold text-slate-700 text-sm">Persentase Kategori</h3>
                <div class="relative w-full max-w-[200px] mx-auto">
                    <canvas id="categoryChartCtx"></canvas>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="font-bold text-slate-700 text-sm">Alokasi Sumber Dana</h3>
                <div class="relative w-full h-[180px]">
                    <canvas id="sourceChartCtx"></canvas>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="font-bold text-slate-700 text-sm">Aliran Dana Terbesar</h3>
                <div id="reportTopExpenses" class="space-y-3">
                    <!-- Loaded dynamically -->
                </div>
            </div>
            <!-- Bottom Spacer to prevent navbar overlapping -->
            <div class="h-28 shrink-0"></div>
        </section>

        <!-- ==================== TAB 4: SETTINGS ==================== -->
        <section id="tab-settings" class="hidden flex-1 flex flex-col overflow-y-auto hide-scrollbar p-6 space-y-6">
            <h2 class="text-xl font-bold text-slate-800 tracking-tight">Pengaturan App</h2>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div
                    class="w-12 h-12 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center font-bold text-lg shrink-0">
                    CA
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 text-sm">Cahya Adi Saputra</h3>
                    <p class="text-xs text-slate-400 font-medium">Developer & Analyst</p>
                </div>
            </div>

            <!-- Kelola Kategori CRUD Panel -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="font-bold text-slate-800 text-sm">Kelola Kategori</h3>
                <div class="flex gap-2">
                    <input type="text" id="newCategoryInput" placeholder="Kategori baru..."
                        class="flex-1 px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs font-semibold bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-500 transition placeholder-slate-400">
                    <button type="button" onclick="addCategory()"
                        class="px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold transition active:scale-95 shrink-0">
                        Tambah
                    </button>
                </div>
                <div id="categoryListContainer"
                    class="divide-y divide-slate-100 max-h-[160px] overflow-y-auto pr-1 hide-scrollbar">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <div
                class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden divide-y divide-slate-100">
                <button onclick="exportToCSV()"
                    class="w-full px-5 py-4 text-left flex items-center justify-between text-slate-700 hover:bg-slate-50 transition active:bg-slate-100">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                            </path>
                        </svg>
                        <span class="text-sm font-semibold">Unduh Rekap Data (CSV)</span>
                    </div>
                </button>

                <a href="https://docs.google.com/spreadsheets/d/1TvPCfI6OjLRqWNv7IqSyTOccxbiiCEgY6N32F3QCfkY/"
                    target="_blank"
                    class="w-full px-5 py-4 text-left flex items-center justify-between text-slate-700 hover:bg-slate-50 transition active:bg-slate-100 block">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                        </svg>
                        <span class="text-sm font-semibold">Buka Google Sheets Asli</span>
                    </div>
                </a>
            </div>

            <div class="text-center text-[11px] text-slate-400 font-medium pt-4">
                Spendy App v2.1 • Native Web PWA
            </div>
            <!-- Bottom Spacer to prevent navbar overlapping -->
            <div class="h-28 shrink-0"></div>
        </section>

        <!-- ==================== PREMIUM BOTTOM NAV BAR ==================== -->
        <!-- Fixed to the bottom of the container -->
        <nav
            class="absolute bottom-0 left-0 right-0 bg-white/80 backdrop-blur-lg border-t border-slate-200/80 px-4 z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.04)] safe-bottom-padding">
            <div class="h-16 flex items-center justify-between">
                <button onclick="switchTab('budgeting')" id="nav-budgeting"
                    class="flex flex-col items-center justify-center w-14 h-full text-slate-400 transition duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 11h.01M12 11h.01M15 11h.01M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z">
                        </path>
                    </svg>
                    <span class="text-[10px] font-bold mt-0.5">Budgeting</span>
                </button>

                <button onclick="switchTab('transactions')" id="nav-transactions"
                    class="flex flex-col items-center justify-center w-14 h-full text-teal-600 transition duration-200 mr-8">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                        </path>
                    </svg>
                    <span class="text-[10px] font-bold mt-0.5">Transaksi</span>
                </button>

                <!-- Spacing for the FAB -->
                <div class="w-14"></div>

                <button onclick="switchTab('reports')" id="nav-reports"
                    class="flex flex-col items-center justify-center w-14 h-full text-slate-400 transition duration-200 ml-8">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path>
                    </svg>
                    <span class="text-[10px] font-bold mt-0.5">Laporan</span>
                </button>

                <button onclick="switchTab('settings')" id="nav-settings"
                    class="flex flex-col items-center justify-center w-14 h-full text-slate-400 transition duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
                        </path>
                    </svg>
                    <span class="text-[10px] font-bold mt-0.5">Setting</span>
                </button>
            </div>
        </nav>

        <!-- CENTRAL FLOATING ACTION BUTTON (FAB) -->
        <!-- Moved OUTSIDE the nav to fix absolute positioning and clickability bugs -->
        <button onclick="bukaModalTambah()"
            class="absolute fab-position left-1/2 transform -translate-x-1/2 w-[60px] h-[60px] bg-gradient-to-br from-teal-500 to-teal-700 text-white rounded-full flex items-center justify-center shadow-[0_8px_20px_rgba(13,148,136,0.4)] hover:from-teal-600 hover:to-teal-800 transition duration-200 active:scale-90 border-[5px] border-white z-40">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
            </svg>
        </button>

    </div>

    <!-- ==================== UI OVERLAYS & DIALOGS ==================== -->

    <div id="formModal"
        class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div
            class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto animate-slide-up relative">
            <div class="flex justify-between items-center border-b pb-4 mb-2">
                <h2 id="modalTitle" class="font-bold text-lg text-slate-800 tracking-tight">Catat Transaksi</h2>
                <button type="button" onclick="tutupModal()"
                    class="text-slate-400 hover:text-slate-600 bg-slate-100 rounded-full p-1.5 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <form id="expenseForm" class="space-y-4 text-sm font-medium pb-2">
                <input type="hidden" id="editRowIndex" value="">

                <div>
                    <label class="block font-bold text-slate-700 mb-1.5">Tanggal</label>
                    <input type="date" id="date" required
                        class="w-full p-3.5 border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:ring-2 focus:ring-teal-500 transition">
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1.5">Kategori</label>
                    <div class="relative">
                        <select id="category" required
                            class="w-full p-3.5 border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:ring-2 focus:ring-teal-500 transition appearance-none">
                            <!-- Loaded dynamically -->
                        </select>
                        <div
                            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5">
                                </path>
                            </svg>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1.5">Jumlah (Rp)</label>
                    <div class="relative flex items-center">
                        <input type="text" id="amount" placeholder="Masukkan Nominal..." required inputmode="numeric"
                            pattern="[0-9.]*" oninput="formatAmountInput(this)"
                            class="w-full p-3.5 pr-20 border border-slate-200 rounded-xl bg-slate-50 font-black text-xl text-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 transition placeholder-slate-300">
                        <button type="button" onclick="appendThousandShortcut()"
                            class="absolute right-2.5 px-3 py-2 bg-slate-200 hover:bg-slate-300 active:scale-95 rounded-lg text-xs font-bold text-slate-700 transition">
                            +000
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-2">Sumber Dana</label>
                    <input type="hidden" id="source" required value="Cash">
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="selectSource('Cash')" id="btn-source-Cash"
                            class="py-3 px-2 rounded-xl border-2 font-bold transition text-xs text-center select-none bg-teal-50 border-teal-500 text-teal-700">
                            Cash
                        </button>
                        <button type="button" onclick="selectSource('E-Wallet')" id="btn-source-E-Wallet"
                            class="py-3 px-2 rounded-xl border bg-slate-50 font-semibold transition text-xs text-center select-none text-slate-700 hover:bg-slate-100">
                            E-Wallet
                        </button>
                        <button type="button" onclick="selectSource('Bank Transfer')" id="btn-source-Bank-Transfer"
                            class="py-3 px-2 rounded-xl border bg-slate-50 font-semibold transition text-xs text-center select-none text-slate-700 hover:bg-slate-100">
                            Bank Transfer
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1.5">Catatan</label>
                    <input type="text" id="notes" placeholder="Tulis rincian pengeluaran..."
                        class="w-full p-3.5 border border-slate-200 rounded-xl bg-slate-50 font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition">
                </div>

                <div class="pt-4">
                    <button type="submit" id="submitBtn"
                        class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition duration-200 text-base active:scale-[0.98]">
                        Simpan Transaksi
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="loadingBackdrop"
        class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[60] flex items-center justify-center">
        <div
            class="bg-white p-6 rounded-3xl shadow-2xl flex flex-col items-center justify-center space-y-4 border border-slate-100 scale-110">
            <div class="animate-spin rounded-full h-10 w-10 border-[4px] border-slate-100 border-t-teal-600"></div>
            <p class="text-[11px] font-extrabold text-slate-500 tracking-widest uppercase">Sinkronisasi...</p>
        </div>
    </div>

    <div id="growlToast"
        class="fixed top-6 left-1/2 -translate-x-1/2 z-[70] transform scale-0 opacity-0 transition-all duration-300 ease-out max-w-xs w-full px-4">
        <div id="growlBg"
            class="bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/10">
            <span id="growlIcon" class="text-lg">✨</span>
            <p id="growlText" class="text-sm font-semibold tracking-wide"></p>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ENGINE ==================== -->
    <script src="app.js" defer></script>
</body>

</html>
